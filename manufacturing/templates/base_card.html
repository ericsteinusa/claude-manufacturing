<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}Manufacturing ERP{% endblock %}</title>
    <style>
        :root {
            --hdr-bg: #0f1d3a;
            --accent: #1d6fe8;
            --accent-hover: #155ec7;
            --border: #d1dae8;
            --text: #0f1d3a;
            --text-muted: #5a6a84;
            --radius: 8px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            background: linear-gradient(135deg, #0f1d3a 0%, #1a3a6b 60%, #0f1d3a 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,.35);
            width: min(420px, 100%);
            padding: 40px 44px;
        }
        @media (max-width: 480px) {
            body { padding: 16px; align-items: flex-start; padding-top: 32px; }
            .card { padding: 28px 22px; border-radius: 10px; }
        }
        .card-logo {
            text-align: center; margin-bottom: 28px;
        }
        .card-logo .logo-mark {
            font-size: 28px; display: inline-block; margin-bottom: 8px;
        }
        .card-logo h1 {
            font-size: 18px; font-weight: 800; color: var(--text);
            letter-spacing: -.3px;
        }
        .card-logo .sub {
            font-size: 12px; color: var(--text-muted); margin-top: 2px;
        }
        .form-row {
            margin-bottom: 16px;
        }
        .form-row label {
            display: block; font-size: 11.5px; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: 5px;
        }
        .form-row input {
            width: 100%; padding: 9px 12px;
            border: 1.5px solid var(--border); border-radius: 6px;
            font-size: 14px; color: var(--text);
            transition: border-color .15s, box-shadow .15s;
        }
        .form-row input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29,111,232,.12);
        }
        .btn-submit {
            display: block; width: 100%;
            background: var(--accent); color: white;
            border: none; border-radius: 6px;
            padding: 10px; font-size: 14px; font-weight: 700;
            cursor: pointer; margin-top: 8px;
            transition: background .15s;
        }
        .btn-submit:hover { background: var(--accent-hover); }
        .btn-row {
            display: flex; gap: 10px; margin-top: 16px;
        }
        .btn {
            flex: 1; text-align: center;
            background: var(--accent); color: white;
            border: none; border-radius: 6px;
            padding: 9px; font-size: 13px; font-weight: 600;
            cursor: pointer; text-decoration: none;
            transition: background .15s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-cancel {
            background: #f1f5fb; color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-cancel:hover { background: #e4eaf5; }
        .error-msg {
            background: #fee2e2; border: 1px solid #fecaca;
            border-radius: 6px; color: #991b1b;
            font-size: 13px; padding: 9px 12px;
            margin-bottom: 16px; text-align: center;
        }
        .success-msg {
            background: #dcfce7; border: 1px solid #bbf7d0;
            border-radius: 6px; color: #166534;
            font-size: 13px; padding: 9px 12px;
            margin-bottom: 16px; text-align: center;
        }
        .links {
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; margin-top: 20px; padding-top: 18px;
            border-top: 1px solid var(--border);
        }
        .links a {
            color: var(--accent); font-size: 13px; text-decoration: none;
        }
        .links a:hover { text-decoration: underline; }
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="card">
        <div class="card-logo">
            <div class="logo-mark">⚙</div>
            <h1>Manufacturing ERP</h1>
            <div class="sub">Enterprise Resource Planning</div>
        </div>
        {% block card_content %}{% endblock %}
    </div>
</body>
</html>
