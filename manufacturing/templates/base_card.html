<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Manufacturing System{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: rgb(0, 85, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .card {
            background-color: rgb(0, 85, 255);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 40px 52px;
            width: 460px;
        }
        h1 {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        .form-row label {
            color: white;
            font-size: 13px;
            width: 140px;
            flex-shrink: 0;
        }
        .form-row input {
            flex: 1;
            background-color: white;
            border: 2px solid black;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
        }
        .form-row input:focus {
            outline: none;
            border-color: rgb(85, 255, 255);
        }
        .error-msg {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.6);
            border-radius: 6px;
            color: white;
            font-size: 13px;
            padding: 8px 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            background-color: white;
            border: 2px solid black;
            border-radius: 10px;
            padding: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background-color: rgb(85, 255, 255);
            border-color: rgb(85, 255, 255);
        }
        .btn-cancel {
            background-color: transparent;
            border: 2px solid white;
            color: white;
        }
        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="card">
        {% block card_content %}{% endblock %}
    </div>
</body>
</html>
