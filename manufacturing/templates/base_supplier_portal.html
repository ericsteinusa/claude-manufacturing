<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}Supplier Portal{% endblock %}</title>
    <style>
        :root {
            --hdr-bg: #1f2d1a;
            --accent: #2b8038;
            --accent-hover: #257032;
            --content-bg: #f0f4ec;
            --card-bg: #ffffff;
            --border: #d7e0cf;
            --text: #1f2d1a;
            --text-muted: #61715a;
            --success-bg: #dcfce7; --success-fg: #166534;
            --warn-bg: #fef9c3;    --warn-fg: #854d0e;
            --danger-bg: #fee2e2;  --danger-fg: #991b1b;
            --info-bg: #dbeafe;    --info-fg: #1e40af;
            --radius: 6px;
            --shadow: 0 1px 4px rgba(31,45,26,.12);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            font-size: 13px; color: var(--text); background: var(--content-bg);
        }
        .portal-header {
            background: var(--hdr-bg); color: white;
            display: flex; align-items: center; gap: 20px;
            padding: 0 24px; height: 54px;
        }
        .portal-brand { font-size: 15px; font-weight: 700; color: white; text-decoration: none; }
        .portal-brand span { color: #7ed88f; }
        .portal-nav { display: flex; gap: 4px; flex: 1; }
        .portal-nav a {
            color: rgba(255,255,255,.78); text-decoration: none;
            font-size: 12.5px; font-weight: 500; padding: 8px 12px; border-radius: 5px;
        }
        .portal-nav a:hover { background: rgba(255,255,255,.1); color: white; }
        .portal-nav a.active { background: rgba(255,255,255,.15); color: white; }
        .portal-user { font-size: 12px; color: rgba(255,255,255,.75); white-space: nowrap; }
        .portal-user strong { color: white; }
        .btn-sm-nav {
            background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
            border-radius: 5px; padding: 5px 13px; font-size: 12.5px; color: white;
            text-decoration: none;
        }
        .btn-sm-nav:hover { background: rgba(255,255,255,.22); }

        .content { padding: 28px 32px 40px; max-width: 1100px; margin: 0 auto; }
        .menu-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 20px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow);
            padding: 20px 24px; margin-bottom: 20px;
        }
        .card-title {
            font-size: 14px; font-weight: 700; color: var(--text);
            margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
        }

        .kpi-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px; margin-bottom: 24px;
        }
        .kpi-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px;
        }
        .kpi-label {
            font-size: 11px; font-weight: 600; letter-spacing: .4px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
        }
        .kpi-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }

        .erp-table-wrap {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto;
        }
        .erp-table { width: 100%; border-collapse: collapse; }
        .erp-table thead th {
            background: #e9f0e4; color: var(--text); font-size: 11.5px; font-weight: 700;
            padding: 9px 12px; text-align: left; border-bottom: 2px solid var(--border);
        }
        .erp-table thead th.num { text-align: right; }
        .erp-table tbody td {
            padding: 9px 12px; border-bottom: 1px solid #eef2ea; font-size: 13px; vertical-align: middle;
        }
        .erp-table tbody td.num { text-align: right; }
        .erp-table tbody tr:last-child td { border-bottom: none; }
        .erp-table tbody tr:hover td { background: #f5f9f2; }
        .erp-table a:not(.btn) { color: var(--accent); font-weight: 600; text-decoration: none; }
        .erp-table a:not(.btn):hover { text-decoration: underline; }

        .pill {
            display: inline-block; padding: 2px 9px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap;
        }
        .pill-draft, .pill-open, .pill-pending, .pill-pending_approval { background: var(--info-bg); color: var(--info-fg); border-color: #bfdbfe; }
        .pill-sent, .pill-partial { background: var(--warn-bg); color: var(--warn-fg); border-color: #fde68a; }
        .pill-received, .pill-paid, .pill-awarded { background: var(--success-bg); color: var(--success-fg); border-color: #bbf7d0; }
        .pill-cancelled, .pill-closed, .pill-rejected { background: #f3f4f6; color: #6b7280; border-color: #e5e7eb; }
        .pill-overdue { background: var(--danger-bg); color: var(--danger-fg); border-color: #fecaca; }

        .erp-form { max-width: 560px; }
        .form-row { margin-bottom: 14px; }
        .form-row label {
            display: block; font-size: 12px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px;
        }
        .form-row input, .form-row select, .form-row textarea {
            width: 100%; padding: 7px 10px; border: 1px solid var(--border);
            border-radius: var(--radius); font-size: 13px; color: var(--text); background: var(--card-bg);
        }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .btn {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--accent); border: 1px solid var(--accent-hover); border-radius: 5px;
            padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
            text-decoration: none; color: white; white-space: nowrap;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-cancel { background: var(--card-bg); border-color: var(--border); color: var(--text); }

        .alert { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 13px; border: 1px solid transparent; }
        .alert-danger  { background: var(--danger-bg); color: var(--danger-fg); border-color: #fecaca; }
        .alert-success { background: var(--success-bg); color: var(--success-fg); border-color: #bbf7d0; }

        .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 14px; }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>

<header class="portal-header">
    <a href="{% url 'supplier_portal_home' %}" class="portal-brand">⚙ <span>MFG</span> Supplier Portal</a>
    <nav class="portal-nav">
        <a href="{% url 'supplier_portal_home' %}" class="{% if request.path == '/supplier-portal/' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'supplier_portal_pos' %}" class="{% if '/supplier-portal/pos/' in request.path %}active{% endif %}">Purchase Orders</a>
        <a href="{% url 'supplier_portal_invoices' %}" class="{% if '/supplier-portal/invoices/' in request.path %}active{% endif %}">Invoices</a>
        <a href="{% url 'supplier_portal_rfqs' %}" class="{% if '/supplier-portal/rfqs/' in request.path %}active{% endif %}">RFQs</a>
    </nav>
    <span class="portal-user"><strong>{{ portal_company }}</strong> · {{ portal_email }}</span>
    <a href="{% url 'supplier_portal_logout' %}" class="btn-sm-nav">Logout</a>
</header>

<div class="content">
    <div class="menu-title">{% block menu_title %}{% endblock %}</div>
    {% block body %}{% endblock %}
</div>

</body>
</html>
