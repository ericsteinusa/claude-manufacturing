{% load i18n %}<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% blocktrans %}Shop Floor OEE — {{ shift }} Shift{% endblocktrans %}</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 32px; background: #0b1220; color: #f0f4ff;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }
    .tv-header { display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 28px; border-bottom: 2px solid #2a3a5c; padding-bottom: 16px; }
    .tv-header h1 { font-size: 40px; margin: 0; }
    .tv-header .clock { font-size: 22px; color: #9fb3d9; }
    .tv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    .tv-card { background: #131c30; border: 2px solid #2a3a5c; border-radius: 14px; padding: 24px 28px; }
    .tv-card h2 { margin: 0 0 12px; font-size: 26px; color: #dbe6ff; }
    .tv-oee { font-size: 72px; font-weight: bold; line-height: 1; }
    .tv-oee.good { color: #4ade80; }
    .tv-oee.warn { color: #fbbf24; }
    .tv-oee.danger { color: #f87171; }
    .tv-bar-track { width: 100%; height: 16px; background: #2a3a5c; border-radius: 8px; overflow: hidden; margin: 16px 0; }
    .tv-bar-fill { height: 100%; }
    .tv-bar-fill.good { background: #4ade80; }
    .tv-bar-fill.warn { background: #fbbf24; }
    .tv-bar-fill.danger { background: #f87171; }
    .tv-metrics { display: flex; justify-content: space-between; font-size: 18px; color: #9fb3d9; }
    .tv-output { font-size: 20px; margin-top: 14px; color: #dbe6ff; }
    .tv-noplan { color: #fbbf24; font-size: 16px; margin-top: 6px; }
    .tv-empty { font-size: 24px; color: #9fb3d9; text-align: center; margin-top: 60px; }
    .tv-grid.htmx-swapping { opacity: 0.4; transition: opacity 200ms ease-out; }
</style>
</head>
<body>
    <div class="tv-header">
        <h1>{% blocktrans %}Shop Floor OEE — {{ shift }} Shift{% endblocktrans %}</h1>
        <div class="clock">{{ entry_date }} &middot; <span id="tv-clock">{{ now|date:"g:i A" }}</span></div>
    </div>

    <div id="tv-content" hx-get="/shop-floor/tv/fragment/" hx-trigger="every 10s" hx-swap="innerHTML">
        {% include "sf_tv_grid.html" %}
    </div>
</body>
<script>
    // Ticks the header clock every second between htmx's 10s data polls,
    // so the display never looks frozen on a shop-floor monitor.
    setInterval(function () {
        document.getElementById('tv-clock').textContent =
            new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
    }, 1000);
</script>
</html>
