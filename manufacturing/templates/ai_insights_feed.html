{% load i18n %}
{% for i in insights %}
<div class="insight-card">
    <div>
        <div class="insight-title">
            <span class="insight-domain {{ i.domain }}">{{ i.domain }}</span>
            {{ i.title }}
        </div>
        <div class="insight-detail">{{ i.detail }}</div>
    </div>
    <div style="text-align:right;white-space:nowrap;">
        <span class="pill-sev {{ i.severity }}">{{ i.severity|capfirst }}</span><br>
        <a href="{{ i.link }}" style="font-size:12px;">{% trans "View →" %}</a>
    </div>
</div>
{% empty %}
<p style="text-align:center;color:var(--text-muted);">{% trans "No active insights right now." %}</p>
{% endfor %}
