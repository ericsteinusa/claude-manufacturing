{% extends "base_card.html" %}
{% load i18n %}

{% block page_title %}{% trans "Change Password" %}{% endblock %}

{% block card_content %}
<h1>{% trans "Change Password" %}</h1>

{% if rotation_notice %}
<div class="error-msg">{{ rotation_notice }}</div>
{% endif %}
{% if error %}
<div class="error-msg">{{ error }}</div>
{% endif %}

<form method="post" action="">
    {% csrf_token %}
    <div class="form-row">
        <label for="email">{% trans "Email:" %}</label>
        <input type="email" id="email" name="email"
               placeholder="{% trans 'Your registered email' %}"
               value="{{ email_value }}" required autofocus>
    </div>
    <div class="form-row">
        <label for="current_password">{% trans "Current Password:" %}</label>
        <input type="password" id="current_password" name="current_password"
               placeholder="{% trans 'Current password' %}" required>
    </div>
    <div class="form-row">
        <label for="password">{% trans "New Password:" %}</label>
        <input type="password" id="password" name="password"
               placeholder="{% trans '8+ chars, upper, lower, digit' %}" required>
    </div>
    <div class="form-row">
        <label for="confirm">{% trans "Confirm:" %}</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="{% trans 'Re-enter new password' %}" required>
    </div>
    <div class="btn-row">
        <button type="submit" class="btn">{% trans "Change Password" %}</button>
        <a href="{% url 'home' %}" style="flex:1; text-decoration:none;">
            <button type="button" class="btn btn-cancel" style="width:100%;">{% trans "Cancel" %}</button>
        </a>
    </div>
</form>
{% endblock %}
