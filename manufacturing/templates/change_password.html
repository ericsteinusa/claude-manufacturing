{% extends "base_card.html" %}

{% block page_title %}Change Password{% endblock %}

{% block card_content %}
<h1>Change Password</h1>

{% if rotation_notice %}
<div class="error-msg">{{ rotation_notice }}</div>
{% endif %}
{% if error %}
<div class="error-msg">{{ error }}</div>
{% endif %}

<form method="post" action="">
    {% csrf_token %}
    <div class="form-row">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Your registered email"
               value="{{ email_value }}" required autofocus>
    </div>
    <div class="form-row">
        <label for="current_password">Current Password:</label>
        <input type="password" id="current_password" name="current_password"
               placeholder="Current password" required>
    </div>
    <div class="form-row">
        <label for="password">New Password:</label>
        <input type="password" id="password" name="password"
               placeholder="8+ chars, upper, lower, digit" required>
    </div>
    <div class="form-row">
        <label for="confirm">Confirm:</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="Re-enter new password" required>
    </div>
    <div class="btn-row">
        <button type="submit" class="btn">Change Password</button>
        <a href="{% url 'home' %}" style="flex:1; text-decoration:none;">
            <button type="button" class="btn btn-cancel" style="width:100%;">Cancel</button>
        </a>
    </div>
</form>
{% endblock %}
