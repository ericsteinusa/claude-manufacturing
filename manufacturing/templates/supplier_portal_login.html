{% extends "base_card.html" %}

{% block page_title %}Supplier Portal Login — Manufacturing ERP{% endblock %}

{% block card_content %}

{% if success %}
<div class="success-msg">{{ success }}</div>
{% endif %}
{% if error %}
<div class="error-msg">{{ error }}</div>
{% endif %}

<form method="post" action="">
    {% csrf_token %}
    <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="you@company.com"
               value="{{ email_value }}" required autofocus>
    </div>
    <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn-submit">Sign In</button>
</form>

<div class="links">
    <a href="{% url 'supplier_portal_register' %}">Set up portal access</a>
    <a href="{% url 'home' %}">Employee login</a>
</div>

{% endblock %}
