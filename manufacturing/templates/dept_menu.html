{% extends "base.html" %}

{% block page_title %}{{ title }}{% endblock %}

{% block toolbar_left %}
<a href="{{ back_url }}" class="btn">Back</a>
{% if full_access %}<a href="/dashboard/" class="btn">Home</a>{% endif %}
{% endblock %}

{% block content %}
<div class="content">
    <div class="menu-title">{{ title }}</div>
    <div class="dept-grid">
        {% for url, label in items %}
        <a href="{{ url }}" class="dept-btn">{{ label }}</a>
        {% endfor %}
    </div>
</div>
{% endblock %}
