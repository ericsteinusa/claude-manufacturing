{% extends "base.html" %}

{% block page_title %}New Blanket PO{% endblock %}

{% block toolbar_left %}
<a href="/blanket-po/" class="btn">← Back</a>
{% endblock %}

{% block body %}
<div class="content">
    <div class="menu-title">New Blanket PO</div>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <div class="erp-form">
        <div class="card">
            <form method="post" action="">
                {% csrf_token %}
                <div class="form-row">
                    <label>Supplier</label>
                    <select name="supplier_id">
                        <option value="">(none)</option>
                        {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.company_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label>Description</label>
                    <input type="text" name="description" value="{{ form.description|default:'' }}">
                </div>
                <div class="form-row">
                    <label>Total Value (leave 0 to track by quantity instead)</label>
                    <input type="number" name="total_value" min="0" step="0.01" value="0.00">
                </div>
                <div class="form-row">
                    <label>Total Quantity (leave 0 to track by value instead)</label>
                    <input type="number" name="total_qty" min="0" step="1" value="0">
                </div>
                <div class="form-row">
                    <label>Start Date</label>
                    <input type="date" name="start_date">
                </div>
                <div class="form-row">
                    <label>End Date</label>
                    <input type="date" name="end_date">
                </div>
                <div class="form-row">
                    <label>Notes</label>
                    <textarea name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Create Blanket PO</button>
                    <a href="/blanket-po/" class="btn btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
