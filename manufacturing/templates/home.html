<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manufacturing System Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: rgb(0, 85, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background-color: rgb(0, 85, 255);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 40px 60px;
            width: 480px;
        }

        h1 {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .form-row label {
            color: white;
            font-size: 13px;
            width: 100px;
            flex-shrink: 0;
        }

        .form-row input {
            flex: 1;
            background-color: white;
            border: 2px solid black;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
        }

        .form-row input:focus {
            outline: none;
            border-color: rgb(85, 255, 255);
        }

        .success-msg {
            background-color: rgba(0, 200, 80, 0.25);
            border: 1px solid rgba(0, 220, 100, 0.6);
            border-radius: 6px;
            color: white;
            font-size: 13px;
            padding: 8px 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .error-msg {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.6);
            border-radius: 6px;
            color: white;
            font-size: 13px;
            padding: 8px 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .btn-login {
            display: block;
            width: 100%;
            background-color: white;
            border: 2px solid black;
            border-radius: 10px;
            padding: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 18px;
        }

        .btn-login:hover {
            background-color: rgb(85, 255, 255);
            border-color: rgb(85, 255, 255);
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .links a {
            color: white;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }

        .links a:hover {
            color: rgb(85, 255, 255);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Manufacturing System Login</h1>

        {% if success %}
        <div class="success-msg">{{ success }}</div>
        {% endif %}
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="">
            {% csrf_token %}
            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"
                       value="{{ email_value }}" required autofocus>
            </div>
            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="links">
            <a href="{% url 'forgot_password' %}">Forgot Password?</a>
            <a href="{% url 'change_password' %}">Change Password</a>
            <a href="{% url 'register' %}">Register New User</a>
        </div>
    </div>
</body>
</html>
