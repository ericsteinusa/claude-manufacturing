{% extends "base.html" %}
{% load i18n %}
{% block page_title %}{% trans "New Company" %}{% endblock %}

{% block toolbar_left %}
<a href="/companies/" class="btn">← {% trans "Back" %}</a>
{% endblock %}

{% block body %}
<div class="content">
    <div class="menu-title">{% trans "New Company" %}</div>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <div class="erp-form">
        <div class="card">
            <form method="post" action="">
                {% csrf_token %}
                <div class="form-row">
                    <label>{% trans "Name" %}</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-row">
                    <label>{% trans "Legal Name" %}</label>
                    <input type="text" name="legal_name">
                </div>
                <div class="form-row">
                    <label>{% trans "Tax ID" %}</label>
                    <input type="text" name="tax_id">
                </div>
                <div class="form-row">
                    <label>{% trans "Currency Code" %}</label>
                    <input type="text" name="currency_code" value="USD" maxlength="3">
                </div>
                <div class="form-row">
                    <label>{% trans "Address" %}</label>
                    <input type="text" name="address">
                </div>
                <div class="form-row">
                    <label>{% trans "Notes" %}</label>
                    <textarea name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">{% trans "Create Company" %}</button>
                    <a href="/companies/" class="btn btn-cancel">{% trans "Cancel" %}</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
