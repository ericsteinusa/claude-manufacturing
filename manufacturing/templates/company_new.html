{% extends "base.html" %}
{% block page_title %}New Company{% endblock %}

{% block toolbar_left %}
<a href="/companies/" class="btn">← Back</a>
{% endblock %}

{% block body %}
<div class="content">
    <div class="menu-title">New Company</div>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <div class="erp-form">
        <div class="card">
            <form method="post" action="">
                {% csrf_token %}
                <div class="form-row">
                    <label>Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-row">
                    <label>Legal Name</label>
                    <input type="text" name="legal_name">
                </div>
                <div class="form-row">
                    <label>Tax ID</label>
                    <input type="text" name="tax_id">
                </div>
                <div class="form-row">
                    <label>Currency Code</label>
                    <input type="text" name="currency_code" value="USD" maxlength="3">
                </div>
                <div class="form-row">
                    <label>Address</label>
                    <input type="text" name="address">
                </div>
                <div class="form-row">
                    <label>Notes</label>
                    <textarea name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Create Company</button>
                    <a href="/companies/" class="btn btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
