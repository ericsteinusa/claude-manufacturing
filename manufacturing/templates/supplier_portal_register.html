{% extends "base_card.html" %}

{% block page_title %}Set Up Supplier Portal Access — Manufacturing ERP{% endblock %}

{% block card_content %}

{% if error %}
<div class="error-msg">{{ error }}</div>
{% endif %}

<form method="post" action="">
    {% csrf_token %}
    <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Use the email on file with your buyer"
               value="{{ email_value }}" required autofocus>
    </div>
    <div class="form-row">
        <label for="password">Choose a Password</label>
        <input type="password" id="password" name="password"
               placeholder="At least 8 characters" required minlength="8">
    </div>
    <button type="submit" class="btn-submit">Create Portal Account</button>
</form>

<div class="links">
    <a href="{% url 'supplier_portal_login' %}">Already have portal access? Log in</a>
</div>

{% endblock %}
