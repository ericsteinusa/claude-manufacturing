# Ruff configuration.
#
# line-length is enforced via the E501 lint rule (see [lint]). Generated
# Qt files and a few legacy scripts are excluded from linting, mirroring
# pyrightconfig.json.
line-length = 79

# Excluded from all linting (generated or legacy/unmaintained).
extend-exclude = [
    "*_ui.py",
    "*_old*.py",
    "*_rc.py",
    "taxes.py",
    "cs_calls.py",
    "customer_entry.py",
    "TK_Login_system.py",
    "TK_name_check_in_SQL.py",
]

[lint]
# ruff defaults (E4, E7, E9, F) plus E501 line-length enforcement.
extend-select = ["E501"]

[lint.per-file-ignores]
# These modules embed multi-line SQL whose interior lines exceed 79
# columns. Those lines live inside triple-quoted strings, so they can
# neither be wrapped without altering the query nor carry a line-level
# `# noqa`. Grandfathered here; reflow the SQL to lift the exemption.
"manufacturing/Accounts_payable.py" = ["E501"]
"manufacturing/Accounts_receivable.py" = ["E501"]
"manufacturing/Bank_reconciliation.py" = ["E501"]
"manufacturing/Credit_dept.py" = ["E501"]
"manufacturing/General_ledger.py" = ["E501"]
