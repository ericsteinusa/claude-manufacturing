# Ruff configuration.
#
# line-length is enforced via the E501 lint rule (see [lint]). Generated
# Qt files and a few legacy scripts are excluded from linting, mirroring
# pyrightconfig.json.
line-length = 120

# Excluded from all linting (generated or legacy/unmaintained).
extend-exclude = [
    "*_ui.py",
    "*_old*.py",
    "*_rc.py",
    "taxes.py",
    "cs_calls.py",
    "customer_entry.py",
    "TK_Login_system.py",
    "TK_name_check_in_SQL.py",
]

[lint]
# ruff defaults (E4, E7, E9, F) plus E501 line-length enforcement.
#
# Written as an explicit `select`, not `extend-select`, because ruff >=0.16
# stopped treating `extend-select` as additive to the default rule set when
# no `select` is also given — with only `extend-select = ["E501"]` it
# enabled every rule ruff knows, not just E501 on top of the defaults.
select = ["E4", "E7", "E9", "F", "E501"]
