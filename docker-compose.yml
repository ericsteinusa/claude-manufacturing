services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-company_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately not published to the host — web/nginx reach it over the
    # compose network by service name. Use `docker compose exec db psql ...`
    # for local access instead of opening the port.

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever DB_HOST/DB_PORT are in .env (which may point at a
      # non-docker local Postgres for bare `manage.py runserver` use) — inside
      # the compose network, "db" is always the right hostname.
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    volumes:
      - staticfiles:/app/staticfiles
      - media_files:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      # Static files only — nginx never touches /app/media. Every uploaded
      # file goes through the authenticated document_download view in the
      # web container, not a direct nginx alias (see nginx/app.conf).
      - staticfiles:/app/staticfiles:ro
      # Shared with the certbot service: certbot_www serves the HTTP-01
      # challenge, certbot_conf holds the issued certs once
      # scripts/setup_tls.sh swaps in nginx/app-ssl.conf.template.
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # The image's default entrypoint runs one certbot command and exits —
    # loop it so certs renew automatically without a host-level cron job,
    # consistent with keeping everything in this compose file. Idle until
    # scripts/setup_tls.sh runs the first `certonly` (via `docker compose run`,
    # a separate one-off invocation, not this loop).
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  staticfiles:
  media_files:
  certbot_conf:
  certbot_www:
